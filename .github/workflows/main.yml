name: Automated Shorts Generator Pipeline

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch: # Allows manual trigger button in the UI

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install System Dependencies (FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Automation Pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      run: |
        python main.py

    - name: Upload Final Video Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MrBeast-Style-Short-Video
        path: assets/final/final_short.mp4
        retention-days: 5
