name: Automated Shorts Generator Pipeline

# 1. Triggers the script automatically and allows manual invocation
on:
  schedule:
    # Runs everyday at exactly 3:00 PM UTC (Adjust cron format for your preferred time)
    - cron: '0 15 * * *'
  workflow_dispatch: # Allows you to click "Run Workflow" manually from GitHub UI

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
    # 2. Checkout your repository code onto the runner
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 3. Install Python 3.10 environment
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # Speeds up subsequent workflow runs

    # 4. Install FFmpeg (CRITICAL: MoviePy/FFmpeg won't render video without this)
    - name: Install System Dependencies (FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    # 5. Install Python dependencies from your requirements.txt
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 6. Execute the video automation pipeline with secure API keys
    - name: Run Automation Pipeline
      env:
        # Passes hidden GitHub secrets securely into your environment variables
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      run: |
        python main.py
