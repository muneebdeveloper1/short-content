name: AudioVerse Video Generator

on:
  schedule:
    - cron: "0 15 * * *" # 20:00 Pakistan time daily
  workflow_dispatch:
    inputs:
      mode:
        description: "Automatic selects a topic; manual uses your topic"
        type: choice
        options: [automatic, manual]
        default: manual
        required: true
      content_type:
        description: "Choose content type"
        type: choice
        options: [documentary, educational, history, science, mystery, motivation, finance, islamic_reminder, news_explainer, facts, story, custom]
        default: documentary
        required: true
      topic:
        description: "Manual topic (required in manual mode)"
        type: string
        required: false
      duration_minutes:
        description: "Target video length in minutes"
        type: choice
        options: ["1", "2", "3", "5", "8", "10", "15", "20", "30", "45", "60"]
        default: "1"
        required: true

permissions:
  contents: read

jobs:
  build-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg and caption fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation
          ffmpeg -filters | grep subtitles
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate, render karaoke captions, and upload privately
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          VIDEO_MODE: ${{ github.event_name == 'schedule' && 'automatic' || github.event.inputs.mode || 'manual' }}
          CONTENT_TYPE: ${{ github.event_name == 'schedule' && vars.AUTO_CONTENT_TYPE || github.event.inputs.content_type || 'documentary' }}
          VIDEO_TOPIC: ${{ github.event.inputs.topic }}
          VIDEO_LENGTH_MINUTES: ${{ github.event_name == 'schedule' && vars.AUTO_VIDEO_LENGTH_MINUTES || github.event.inputs.duration_minutes || '1' }}
          UPLOAD_TO_YOUTUBE: 'true'
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_TOKEN_JSON_BOOKS: ${{ secrets.YOUTUBE_TOKEN_JSON_BOOKS }}
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_PRIVACY_STATUS: private
          FFMPEG_PRESET: veryfast
        run: python main.py
      - name: Save generated MP4 and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AudioVerse-landscape-video
          path: |
            assets/final/*.mp4
            assets/final/video_metadata.json
          if-no-files-found: warn
          retention-days: 5
