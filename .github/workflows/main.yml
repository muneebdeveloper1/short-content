name: AudioVerse Video Generator

on:
  schedule:
    - cron: "0 15 * * *" # Runs daily at 20:00 Pakistan time

  workflow_dispatch:
    inputs:
      mode:
        description: "Automatic selects a topic; manual uses your topic"
        type: choice
        options:
          - automatic
          - manual
        default: manual
        required: true

      content_type:
        description: "Choose content type"
        type: choice
        options:
          - documentary
          - educational
          - history
          - science
          - mystery
          - motivation
          - finance
          - islamic_reminder
          - news_explainer
          - facts
          - story
          - custom
        default: documentary
        required: true

      topic:
        description: "Enter your topic when using manual mode"
        type: string
        required: false

      duration_minutes:
        description: "Target video length in minutes"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "5"
          - "8"
          - "10"
          - "15"
          - "20"
          - "30"
          - "45"
          - "60"
        default: "1"
        required: true

permissions:
  contents: read

jobs:
  build-and-generate:
    name: Generate Landscape Video and Upload to YouTube
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg and caption fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation
          ffmpeg -filters | grep subtitles

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

          # Explicitly install YouTube API dependencies.
          python -m pip install \
            "google-api-python-client>=2.150.0" \
            "google-auth>=2.35.0" \
            "google-auth-httplib2>=0.2.0" \
            "google-auth-oauthlib>=1.2.1"

          # Stop immediately if the YouTube API library is unavailable.
          python -c "from googleapiclient.discovery import build; print('YouTube API library installed successfully')"

      - name: Generate video, burn karaoke captions, and upload privately
        env:
          # API keys
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

          # Gemini model configuration
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}

          # Automatic or manual generation
          VIDEO_MODE: ${{ github.event_name == 'schedule' && 'automatic' || github.event.inputs.mode || 'manual' }}

          # Content category
          CONTENT_TYPE: ${{ github.event_name == 'schedule' && vars.AUTO_CONTENT_TYPE || github.event.inputs.content_type || 'documentary' }}

          # User-provided topic for manual mode
          VIDEO_TOPIC: ${{ github.event.inputs.topic }}

          # Requested duration
          VIDEO_LENGTH_MINUTES: ${{ github.event_name == 'schedule' && vars.AUTO_VIDEO_LENGTH_MINUTES || github.event.inputs.duration_minutes || '1' }}

          # YouTube upload settings
          UPLOAD_TO_YOUTUBE: "true"
          YOUTUBE_PRIVACY_STATUS: private

          # YouTube OAuth credentials
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}

          # Optional alternate credentials used by existing repository code
          YOUTUBE_TOKEN_JSON_BOOKS: ${{ secrets.YOUTUBE_TOKEN_JSON_BOOKS }}
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}

          # Video rendering
          FFMPEG_PRESET: veryfast

        run: python main.py

      - name: Save generated video and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AudioVerse-landscape-video
          path: |
            assets/final/*.mp4
            assets/final/video_metadata.json
          if-no-files-found: warn
          retention-days: 5
